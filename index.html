<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Meta SEO & Keywords -->
    <title>Unsur dan Prinsip Seni Rupa - Kelas 5 SD Negeri 2 Sendang Ayu</title>
    <meta name="description" content="Game edukasi interaktif untuk siswa kelas 5 SD menjelajahi unsur dan prinsip seni rupa di sekitar kita secara menyenangkan.">
    <meta name="keywords" content="seni rupa, unsur seni rupa, prinsip seni rupa, kelas 5, game edukasi, media pembelajaran interaktif, sekolah dasar">
    <meta name="author" content="Pak Lehan">
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="Logo-Tut-Wuri-Handayani-PNG-Warna.png">
    
    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:title" content="Unsur dan Prinsip Seni Rupa - Kelas 5">
    <meta property="og:description" content="Game edukasi interaktif untuk siswa kelas 5 SD menjelajahi unsur dan prinsip seni rupa di sekitar kita secara menyenangkan.">
    <meta property="og:image" content="tumi_2.png">
    <meta property="og:url" content="https://website-anda.com">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Unsur dan Prinsip Seni Rupa - Kelas 5">
    <meta name="twitter:description" content="Game edukasi interaktif untuk siswa kelas 5 SD menjelajahi unsur dan prinsip seni rupa di sekitar kita secara menyenangkan.">
    <meta name="twitter:image" content="tumi_2.png">
    
    <!-- Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Untuk Ikon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            /* Mencegah highlight biru saat di-tap di perangkat mobile */
            -webkit-tap-highlight-color: transparent; 
        }
        /* Background Pattern */
        .bg-cross-pattern {
            background-color: #1a235a; 
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M19 19V0h2v19h19v2H21v19h-2V21H0v-2h19z' fill='%23ffffff' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [gameState, setGameState] = useState({
                isPlaying: false,
                studentName: '',
                studentClass: '',
                unlockedLevel: 1,
                currentLevel: null,
                score: 0,
                lives: 3,
                badges: [],
                savedArtwork: null
            });

            const [showForm, setShowForm] = useState(false);
            const [nameInput, setNameInput] = useState('');
            const [classInput, setClassInput] = useState('5');
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            
            const toastTimeoutRef = useRef(null);

            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [gameState.currentLevel, gameState.isPlaying]);

            const showFeedback = (message, type = 'success') => {
                setToast({ show: true, message, type });
                if (toastTimeoutRef.current) {
                    clearTimeout(toastTimeoutRef.current);
                }
                toastTimeoutRef.current = setTimeout(() => {
                    setToast({ show: false, message: '', type: 'success' });
                }, 3000);
            };

            const toggleFullScreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log(`Error: ${err.message}`);
                    });
                } else {
                    if(document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            };

            const startGame = (levelId) => {
                setGameState({ ...gameState, currentLevel: levelId });
            };

            const handleStartPlaying = (e) => {
                e.preventDefault();
                if (nameInput.trim() === '') {
                    showFeedback('Masukkan nama kamu dulu ya!', 'error');
                    return;
                }
                setGameState({
                    ...gameState,
                    isPlaying: true,
                    studentName: nameInput,
                    studentClass: classInput,
                });
            };

            const completeLevel = (levelId, points = 10) => {
                const nextLevel = levelId + 1;
                setGameState((prev) => ({
                    ...prev,
                    score: prev.score + points,
                    unlockedLevel: nextLevel > prev.unlockedLevel ? nextLevel : prev.unlockedLevel,
                    currentLevel: null // Kembali ke peta
                }));
                showFeedback(`Misi ${levelId} Selesai! +${points} Poin`, 'success');
            };

            const levels = [
                { id: 1, title: 'Misi 1', subtitle: 'Kenali Unsur', icon: 'fa-solid fa-book-open' },
                { id: 2, title: 'Misi 2', subtitle: 'Cari Unsur', icon: 'fa-solid fa-magnifying-glass' },
                { id: 3, title: 'Misi 3', subtitle: 'Cocokkan', icon: 'fa-solid fa-arrow-pointer' },
                { id: 4, title: 'Misi 4', subtitle: 'Tebak Gambar', icon: 'fa-regular fa-image' },
                { id: 5, title: 'Misi 5', subtitle: 'Susun Seni', icon: 'fa-solid fa-shapes' },
                { id: 6, title: 'Misi 6', subtitle: 'Kenali Prinsip', icon: 'fa-solid fa-star' },
                { id: 7, title: 'Misi 7', subtitle: 'Eksperimen', icon: 'fa-solid fa-palette' },
                { id: 8, title: 'Misi 8', subtitle: 'Studio Seni', icon: 'fa-solid fa-trophy' },
            ];

            const Level1 = () => (
                <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 max-w-3xl mx-auto w-full">
                    <h2 className="text-lg md:text-xl font-bold text-slate-800 mb-2">Misi 1 : Kenali Unsur Rupa</h2>
                    <p className="text-sm md:text-base text-slate-600 mb-6">Pahami unsur-unsur dasar yang membentuk sebuah karya seni.</p>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                            <h3 className="font-bold text-blue-800 text-sm md:text-base">Titik & Garis</h3>
                            <p className="text-xs md:text-sm text-blue-600 mt-1">Titik adalah unsur terkecil. Garis adalah kumpulan titik yang memanjang.</p>
                        </div>
                        <div className="bg-green-50 p-4 rounded-xl border border-green-100">
                            <h3 className="font-bold text-green-800 text-sm md:text-base">Bidang & Bentuk</h3>
                            <p className="text-xs md:text-sm text-green-600 mt-1">Bidang memiliki panjang dan lebar (2D). Bentuk memiliki volume (3D).</p>
                        </div>
                        <div className="bg-orange-50 p-4 rounded-xl border border-orange-100">
                            <h3 className="font-bold text-orange-800 text-sm md:text-base">Warna & Tekstur</h3>
                            <p className="text-xs md:text-sm text-orange-600 mt-1">Warna memberi kesan nyata. Tekstur adalah sifat permukaan benda (halus/kasar).</p>
                        </div>
                        <div className="bg-purple-50 p-4 rounded-xl border border-purple-100">
                            <h3 className="font-bold text-purple-800 text-sm md:text-base">Ruang</h3>
                            <p className="text-xs md:text-sm text-purple-600 mt-1">Ruang memberi kesan jauh-dekat dan kedalaman pada gambar.</p>
                        </div>
                    </div>
                    <button onClick={() => completeLevel(1)} className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-colors text-sm md:text-base">
                        Lanjutkan Misi
                    </button>
                </div>
            );

            const Level2 = () => {
                const [matches, setMatches] = useState(0);
                const [selectedLabel, setSelectedLabel] = useState(null);
                const [matchedItems, setMatchedItems] = useState([]);

                const items = [
                    { id: 'garis', label: 'Garis', object: 'Pohon', emoji: '🌳' },
                    { id: 'warna', label: 'Warna', object: 'Daun', emoji: '🍃' },
                    { id: 'tekstur', label: 'Tekstur', object: 'Batu', emoji: '🪨' },
                    { id: 'bidang', label: 'Bidang', object: 'Jendela', emoji: '🪟' },
                    { id: 'bentuk', label: 'Bentuk', object: 'Bola', emoji: '⚽' },
                ];

                const handleObjectClick = (item) => {
                    if (!selectedLabel) return;
                    if (selectedLabel.id === item.id && !matchedItems.includes(item.id)) {
                        setMatches(m => m + 1);
                        setMatchedItems([...matchedItems, item.id]);
                        setSelectedLabel(null);
                        showFeedback('Tepat sekali!', 'success');
                    } else if (!matchedItems.includes(item.id)) {
                        showFeedback('Kurang tepat, coba lagi!', 'error');
                        setSelectedLabel(null);
                    }
                };

                return (
                    <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 max-w-4xl mx-auto w-full">
                        <h2 className="text-lg md:text-xl font-bold text-slate-800 mb-2">Misi 2 : Cari Unsur Rupa</h2>
                        <p className="text-sm md:text-base text-slate-600 mb-6">Pilih label di bawah, lalu pilih objek yang sesuai.</p>
                        
                        <div className="bg-green-50 p-4 md:p-6 rounded-xl mb-6 grid grid-cols-2 md:flex md:justify-around flex-wrap gap-3 md:gap-4 border border-green-200">
                            {items.map(item => (
                                <button key={item.id} onClick={() => handleObjectClick(item)} disabled={matchedItems.includes(item.id)}
                                    className={`relative p-3 md:p-4 rounded-xl flex flex-col items-center justify-center transition-all md:min-w-[100px]
                                    ${matchedItems.includes(item.id) ? 'bg-green-200 opacity-50 cursor-not-allowed scale-95' : 'bg-white hover:bg-slate-50 shadow-sm border border-slate-200 active:scale-95 md:hover:-translate-y-1'}`}
                                >
                                    <span className="text-3xl md:text-4xl mb-1 md:mb-2">{item.emoji}</span>
                                    <span className="font-bold text-xs md:text-sm text-slate-700">{item.object}</span>
                                    {matchedItems.includes(item.id) && <i className="fa-solid fa-check text-green-600 mt-2 absolute"></i>}
                                </button>
                            ))}
                        </div>

                        <div className="flex flex-wrap gap-2 md:gap-3 justify-center mb-8">
                            {items.map(item => (
                                <button key={`label-${item.id}`} onClick={() => setSelectedLabel(item)} disabled={matchedItems.includes(item.id)}
                                    className={`px-4 py-2 text-sm md:text-base md:px-6 md:py-2 rounded-lg font-bold transition-colors border
                                    ${matchedItems.includes(item.id) ? 'bg-slate-100 text-slate-400 border-slate-200 hidden' : 
                                    selectedLabel?.id === item.id ? 'bg-blue-600 text-white border-blue-600' : 'bg-blue-50 text-blue-600 border-blue-200 hover:bg-blue-100'}`}
                                >
                                    {item.label}
                                </button>
                            ))}
                        </div>
                        
                        {/* TOMBOL SELALU AKTIF */}
                        <button onClick={() => completeLevel(2, 20)}
                            className="w-full font-bold py-3 rounded-xl transition-colors text-sm md:text-base bg-blue-600 text-white hover:bg-blue-700">
                            Lanjutkan Misi
                        </button>
                    </div>
                );
            };

            const Level3 = () => {
                const [selectedCards, setSelectedCards] = useState([]);
                const [matchedPairs, setMatchedPairs] = useState([]);
                const [shuffledCards, setShuffledCards] = useState([]);

                useEffect(() => {
                    const cards = [
                        { id: '1a', type: 'unsur', text: 'Bidang', pairId: '1' },
                        { id: '1b', type: 'benda', text: 'Buku', pairId: '1' },
                        { id: '2a', type: 'unsur', text: 'Bentuk', pairId: '2' },
                        { id: '2b', type: 'benda', text: 'Jeruk', pairId: '2' },
                        { id: '3a', type: 'unsur', text: 'Garis', pairId: '3' },
                        { id: '3b', type: 'benda', text: 'Pagar', pairId: '3' },
                        { id: '4a', type: 'unsur', text: 'Warna', pairId: '4' },
                        { id: '4b', type: 'benda', text: 'Pelangi', pairId: '4' },
                    ].sort(() => Math.random() - 0.5);
                    setShuffledCards(cards);
                }, []);

                const handleCardClick = (card) => {
                    if (selectedCards.length === 2 || matchedPairs.includes(card.pairId) || selectedCards.find(c => c.id === card.id)) return;
                    const newSelected = [...selectedCards, card];
                    setSelectedCards(newSelected);

                    if (newSelected.length === 2) {
                        if (newSelected[0].pairId === newSelected[1].pairId && newSelected[0].type !== newSelected[1].type) {
                            setTimeout(() => {
                                setMatchedPairs([...matchedPairs, newSelected[0].pairId]);
                                setSelectedCards([]);
                                showFeedback('Pasangan Cocok!', 'success');
                            }, 800);
                        } else {
                            setTimeout(() => {
                                setSelectedCards([]);
                                showFeedback('Belum cocok, coba lagi.', 'error');
                            }, 800);
                        }
                    }
                };

                return (
                    <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 max-w-3xl mx-auto w-full">
                        <h2 className="text-lg md:text-xl font-bold text-slate-800 mb-2">Misi 3 : Cari Pasangan</h2>
                        <p className="text-sm md:text-base text-slate-600 mb-6">Cocokkan kartu <b>Unsur</b> dengan contoh <b>Benda</b> yang tepat.</p>
                        
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-8">
                            {shuffledCards.map(card => {
                                const isSelected = selectedCards.find(c => c.id === card.id);
                                const isMatched = matchedPairs.includes(card.pairId);
                                return (
                                    <button key={card.id} onClick={() => handleCardClick(card)}
                                        className={`h-20 md:h-24 p-2 rounded-xl flex flex-col items-center justify-center border-2 transition-all font-bold text-sm md:text-lg
                                        ${isMatched ? 'bg-green-100 border-green-300 text-green-700 opacity-50 cursor-default scale-95' : 
                                        isSelected ? 'bg-blue-50 border-blue-400 text-blue-700 scale-105' : 
                                        'bg-white border-slate-200 text-slate-700 hover:border-slate-300 shadow-sm'}`}
                                    >
                                        <span className="text-[10px] md:text-xs font-normal text-slate-400 mb-1 uppercase tracking-wider">{card.type}</span>
                                        {card.text}
                                    </button>
                                );
                            })}
                        </div>
                        
                        {/* TOMBOL SELALU AKTIF */}
                        <button onClick={() => completeLevel(3, 15)} 
                            className="w-full font-bold py-3 rounded-xl transition-colors text-sm md:text-base bg-blue-600 text-white hover:bg-blue-700">
                            Lanjutkan Misi
                        </button>
                    </div>
                );
            };

            const Level4 = () => {
                const [currentQ, setCurrentQ] = useState(0);
                const [isCompleted, setIsCompleted] = useState(false);
                
                const questions = [
                    { image: '🪨', question: 'Unsur seni rupa apa yang paling dominan pada batu kasar ini?', options: ['Tekstur', 'Warna', 'Titik', 'Ruang'], answer: 'Tekstur' },
                    { image: '🪟', question: 'Permukaan datar pada jendela ini merupakan contoh dari...', options: ['Warna', 'Bidang', 'Tekstur', 'Titik'], answer: 'Bidang' },
                    { image: '⚽', question: 'Bola yang bulat dan memiliki ruang di dalamnya adalah contoh...', options: ['Bentuk', 'Garis', 'Titik', 'Bidang'], answer: 'Bentuk' }
                ];

                const handleAnswer = (opt) => {
                    if (opt === questions[currentQ].answer) {
                        showFeedback('Benar!', 'success');
                        if (currentQ < questions.length - 1) {
                            setTimeout(() => setCurrentQ(c => c + 1), 1000);
                        } else {
                            setTimeout(() => setIsCompleted(true), 1000);
                        }
                    } else {
                        showFeedback('Salah, coba ingat lagi!', 'error');
                    }
                };

                return (
                    <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 max-w-2xl mx-auto w-full text-center">
                        <h2 className="text-lg md:text-xl font-bold text-slate-800 mb-2">Misi 4 : Tebak Gambar</h2>
                        <p className="text-sm md:text-base text-slate-600 mb-6 md:mb-8">Pilih unsur yang paling menonjol.</p>
                        
                        {!isCompleted ? (
                            <>
                                <div className="text-7xl md:text-9xl mb-6 md:mb-8">{questions[currentQ].image}</div>
                                <p className="font-bold text-slate-700 mb-6 text-sm md:text-base px-2">{questions[currentQ].question}</p>
                                
                                <div className="grid grid-cols-2 gap-3 md:gap-4">
                                    {questions[currentQ].options.map(opt => (
                                        <button key={opt} onClick={() => handleAnswer(opt)}
                                            className="bg-blue-50 text-blue-700 border border-blue-200 py-3 rounded-xl font-bold hover:bg-blue-600 hover:text-white transition-colors text-sm md:text-base">
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            </>
                        ) : (
                            <div className="text-center animate-bounce mb-6 mt-10">
                                <span className="bg-green-100 text-green-700 font-bold px-4 py-3 md:px-6 md:py-4 text-sm md:text-xl rounded-full border border-green-300 inline-block">
                                    Hebat! Semua tebakan benar! 🎉
                                </span>
                            </div>
                        )}

                        {/* TOMBOL SELALU AKTIF */}
                        <button onClick={() => completeLevel(4, 20)}
                            className="w-full mt-8 font-bold py-3 rounded-xl transition-colors text-sm md:text-base bg-blue-600 text-white hover:bg-blue-700">
                            Lanjutkan Misi
                        </button>
                    </div>
                );
            };

            const Level5 = () => {
                const [isBuilt, setIsBuilt] = useState(false);
                
                return (
                    <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 max-w-2xl mx-auto w-full text-center">
                        <h2 className="text-lg md:text-xl font-bold text-slate-800 mb-2">Misi 5 : Susun Seni</h2>
                        <p className="text-sm md:text-base text-slate-600 mb-6">Satukan bentuk-bentuk geometris ini menjadi sebuah rumah! (Klik salah satu bangun ruang)</p>
                        
                        <div className="h-56 md:h-64 bg-blue-50 border-2 border-dashed border-blue-200 rounded-xl relative overflow-hidden mb-6 flex items-center justify-center">
                            {!isBuilt ? (
                                <div className="flex gap-4 items-end">
                                   <div className="w-0 h-0 border-l-[30px] border-l-transparent border-b-[50px] border-b-red-400 border-r-[30px] border-r-transparent md:border-l-[40px] md:border-b-[60px] md:border-r-[40px] animate-pulse cursor-pointer hover:scale-110 transition-transform" onClick={() => setIsBuilt(true)}></div>
                                   <div className="w-16 h-16 md:w-20 md:h-20 bg-yellow-400 animate-pulse cursor-pointer hover:scale-110 transition-transform" onClick={() => setIsBuilt(true)}></div>
                                </div>
                            ) : (
                                <div className="absolute bottom-6 md:bottom-10 left-1/2 -translate-x-1/2 animate-bounce">
                                    <div className="w-0 h-0 border-l-[50px] border-l-transparent border-b-[60px] border-b-red-500 border-r-[50px] border-r-transparent md:border-l-[60px] md:border-b-[80px] md:border-r-[60px] mx-auto"></div>
                                    <div className="w-[100px] h-[80px] md:w-[120px] md:h-[100px] bg-yellow-400 relative border-t-0 mx-auto">
                                        <div className="w-6 h-10 md:w-8 md:h-12 bg-amber-700 absolute bottom-0 left-1/2 -translate-x-1/2 rounded-t-md"></div>
                                        <div className="w-6 h-6 md:w-8 md:h-8 bg-blue-300 absolute top-3 md:top-4 left-2 rounded-sm opacity-80 border-2 border-blue-200"></div>
                                        <div className="w-6 h-6 md:w-8 md:h-8 bg-blue-300 absolute top-3 md:top-4 right-2 rounded-sm opacity-80 border-2 border-blue-200"></div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* TOMBOL SELALU AKTIF */}
                        <button onClick={() => completeLevel(5, 10)}
                            className="w-full font-bold py-3 rounded-xl transition-colors text-sm md:text-base bg-blue-600 text-white hover:bg-blue-700">
                            Lanjutkan Misi
                        </button>
                    </div>
                );
            };

            const Level6 = () => {
                const [selected, setSelected] = useState(null);
                const handleSelect = (ans) => {
                    setSelected(ans);
                    if (ans === 'b') {
                        showFeedback('Benar! Komposisi B lebih seimbang secara asimetris.', 'success');
                    } else {
                        showFeedback('Kurang tepat, coba lihat berat visualnya.', 'error');
                    }
                };

                return (
                    <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 max-w-3xl mx-auto w-full text-center">
                        <h2 className="text-lg md:text-xl font-bold text-slate-800 mb-2">Misi 6 : Prinsip Keseimbangan</h2>
                        <p className="text-sm md:text-base text-slate-600 mb-6">Pilih gambar mana yang memiliki <b>Keseimbangan Asimetris</b> yang baik.</p>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 mb-8">
                            <div onClick={() => handleSelect('a')} className={`p-4 border-2 rounded-xl cursor-pointer bg-slate-50 transition-colors ${selected === 'a' ? 'border-red-400' : 'border-slate-200 hover:bg-slate-100'}`}>
                                <h3 className="font-bold mb-4 text-sm md:text-base">Gambar A</h3>
                                <div className="h-24 md:h-32 flex items-center justify-start gap-2 pl-4">
                                   <div className="w-12 h-12 md:w-16 md:h-16 bg-slate-800 rounded-full"></div>
                                   <div className="w-3 h-3 md:w-4 md:h-4 bg-slate-400 rounded-full"></div>
                                </div>
                            </div>
                            <div onClick={() => handleSelect('b')} className={`p-4 border-2 rounded-xl cursor-pointer bg-slate-50 transition-colors ${selected === 'b' ? 'border-green-400 bg-green-50' : 'border-slate-200 hover:bg-slate-100'}`}>
                                <h3 className="font-bold mb-4 text-sm md:text-base">Gambar B</h3>
                                <div className="h-24 md:h-32 flex items-center justify-between px-4 md:px-8">
                                   <div className="w-12 h-12 md:w-16 md:h-16 bg-slate-800 rounded-full"></div>
                                   <div className="flex gap-1 md:gap-2 ml-auto">
                                       <div className="w-6 h-6 md:w-8 md:h-8 bg-slate-400 rounded-full"></div>
                                       <div className="w-6 h-6 md:w-8 md:h-8 bg-slate-400 rounded-full"></div>
                                   </div>
                                </div>
                            </div>
                        </div>

                        {/* TOMBOL SELALU AKTIF */}
                        <button onClick={() => completeLevel(6, 15)}
                            className="w-full font-bold py-3 rounded-xl transition-colors text-sm md:text-base bg-blue-600 text-white hover:bg-blue-700">
                            Lanjutkan Misi
                        </button>
                    </div>
                );
            };

            const Level7 = () => {
                const [mixedColor, setMixedColor] = useState(null);
                const [slots, setSlots] = useState([]);
                
                const colors = [
                    { id: 'red', hex: '#ef4444', name: 'Merah' },
                    { id: 'yellow', hex: '#facc15', name: 'Kuning' },
                    { id: 'blue', hex: '#3b82f6', name: 'Biru' }
                ];

                const handleMix = (color) => {
                    if (slots.length < 2) {
                        const newSlots = [...slots, color];
                        setSlots(newSlots);
                        
                        if (newSlots.length === 2) {
                            let result = '';
                            const ids = newSlots.map(c => c.id).sort().join('-');
                            if (ids === 'red-yellow') result = '#ea580c'; // Oranye
                            else if (ids === 'blue-yellow') result = '#22c55e'; // Hijau
                            else if (ids === 'blue-red') result = '#9333ea'; // Ungu
                            else result = '#475569'; // Abu-abu
                            
                            setMixedColor(result);
                            setTimeout(() => {
                                showFeedback('Wah, warna baru tercipta!', 'success');
                            }, 500);
                        }
                    }
                };

                const reset = () => {
                    setSlots([]);
                    setMixedColor(null);
                };

                return (
                    <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 max-w-2xl mx-auto w-full text-center">
                        <h2 className="text-lg md:text-xl font-bold text-slate-800 mb-2">Misi 7 : Eksperimen Warna</h2>
                        <p className="text-sm md:text-base text-slate-600 mb-6">Pilih dua warna primer untuk dicampur!</p>
                        
                        <div className="flex justify-center gap-3 md:gap-4 mb-6 md:mb-8">
                            {colors.map(c => (
                                <button key={c.id} onClick={() => handleMix(c)} className="w-12 h-12 md:w-16 md:h-16 rounded-full shadow-md border-2 md:border-4 border-white md:hover:scale-110 active:scale-95 transition-transform" style={{backgroundColor: c.hex}}></button>
                            ))}
                        </div>

                        <div className="flex items-center justify-center gap-2 md:gap-4 mb-6 md:mb-8 bg-slate-50 p-4 md:p-6 rounded-xl border border-slate-200">
                            <div className="w-12 h-12 md:w-20 md:h-20 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center shadow-inner transition-colors" style={{backgroundColor: slots[0]?.hex || 'transparent'}}>
                                {!slots[0] && <span className="text-slate-300 font-bold text-sm md:text-base">1</span>}
                            </div>
                            <span className="text-xl md:text-2xl font-bold text-slate-400">+</span>
                            <div className="w-12 h-12 md:w-20 md:h-20 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center shadow-inner transition-colors" style={{backgroundColor: slots[1]?.hex || 'transparent'}}>
                                {!slots[1] && <span className="text-slate-300 font-bold text-sm md:text-base">2</span>}
                            </div>
                            <span className="text-xl md:text-2xl font-bold text-slate-400">=</span>
                            <div className="w-16 h-16 md:w-24 md:h-24 rounded-full border-4 border-white shadow-lg flex items-center justify-center transition-all duration-700" style={{backgroundColor: mixedColor || 'transparent', transform: mixedColor ? 'scale(1.1)' : 'scale(1)'}}>
                                {!mixedColor && <i className="fa-solid fa-question text-slate-300 text-2xl"></i>}
                            </div>
                        </div>

                        {mixedColor && (
                            <button onClick={reset} className="text-slate-500 underline text-sm mb-6 block mx-auto hover:text-slate-700">
                                <i className="fa-solid fa-rotate-right mr-1"></i> Ulangi Campuran
                            </button>
                        )}

                        {/* TOMBOL SELALU AKTIF */}
                        <button onClick={() => completeLevel(7, 20)}
                            className="w-full font-bold py-3 rounded-xl transition-colors text-sm md:text-base bg-blue-600 text-white hover:bg-blue-700">
                            Lanjutkan Misi
                        </button>
                    </div>
                );
            };

            const Level8 = () => {
                const [artElements, setArtElements] = useState([]);
                
                const addElement = (emoji) => {
                    setArtElements([...artElements, emoji]);
                };

                return (
                    <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 max-w-2xl mx-auto w-full text-center">
                        <h2 className="text-lg md:text-xl font-bold text-slate-800 mb-2">Misi 8 : Studio Seni</h2>
                        <p className="text-sm md:text-base text-slate-600 mb-6">Berkreasilah! Tambahkan minimal 4 elemen ke dalam kanvas.</p>
                        
                        <div className="flex justify-center gap-2 mb-6">
                            <button onClick={() => addElement('🔴')} className="text-2xl md:text-3xl p-3 bg-slate-100 rounded-xl hover:bg-slate-200 hover:scale-110 transition-transform">🔴</button>
                            <button onClick={() => addElement('🟦')} className="text-2xl md:text-3xl p-3 bg-slate-100 rounded-xl hover:bg-slate-200 hover:scale-110 transition-transform">🟦</button>
                            <button onClick={() => addElement('⭐')} className="text-2xl md:text-3xl p-3 bg-slate-100 rounded-xl hover:bg-slate-200 hover:scale-110 transition-transform">⭐</button>
                            <button onClick={() => addElement('〰️')} className="text-2xl md:text-3xl p-3 bg-slate-100 rounded-xl hover:bg-slate-200 hover:scale-110 transition-transform">〰️</button>
                        </div>

                        <div className="h-48 md:h-64 bg-slate-50 border-4 border-slate-200 rounded-xl mb-6 p-4 flex flex-wrap content-start gap-2 shadow-inner relative overflow-hidden">
                            {artElements.map((el, idx) => (
                                <span key={idx} className="text-3xl md:text-4xl animate-bounce">{el}</span>
                            ))}
                            {artElements.length === 0 && (
                                <span className="absolute inset-0 flex items-center justify-center text-slate-400 font-bold">Kanvas masih kosong</span>
                            )}
                        </div>

                        {artElements.length > 0 && (
                            <button onClick={() => setArtElements([])} className="text-slate-500 underline text-sm mb-6 block mx-auto hover:text-slate-700">
                                Bersihkan Kanvas
                            </button>
                        )}

                        {/* TOMBOL SELALU AKTIF */}
                        <button onClick={() => { completeLevel(8, 50); showFeedback('Selamat! Kamu menyelesaikan semua misi!', 'success') }}
                            className="w-full font-bold py-3 rounded-xl transition-colors text-sm md:text-base bg-green-600 text-white hover:bg-green-700">
                            Selesaikan Petualangan
                        </button>
                    </div>
                );
            };

            const renderContent = () => {
                if (!gameState.isPlaying) {
                    return (
                        <div className="max-w-md mx-auto bg-white p-6 md:p-8 rounded-3xl shadow-sm text-center mt-10 md:mt-20">
                            <div className="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                                <i className="fa-solid fa-palette"></i>
                            </div>
                            <h1 className="text-2xl md:text-3xl font-black text-slate-800 mb-2">Petualangan Seni</h1>
                            <p className="text-slate-500 mb-8 font-medium">Kelas 5 SD Negeri 2 Sendang Ayu</p>
                            
                            <form onSubmit={handleStartPlaying}>
                                <input 
                                    type="text" 
                                    placeholder="Siapa namamu?" 
                                    value={nameInput} 
                                    onChange={(e) => setNameInput(e.target.value)}
                                    className="w-full bg-slate-50 border-2 border-slate-200 text-slate-800 px-4 py-3 rounded-xl mb-6 font-bold text-center focus:border-blue-500 focus:bg-white outline-none transition-colors"
                                />
                                <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-colors active:scale-95 shadow-md">
                                    Mulai Bermain
                                </button>
                            </form>
                        </div>
                    );
                }

                if (gameState.currentLevel !== null) {
                    return (
                        <div className="mt-6 md:mt-10">
                            <button onClick={() => setGameState({...gameState, currentLevel: null})} className="mb-6 ml-2 text-blue-100 hover:text-white transition-colors bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg font-bold backdrop-blur-sm">
                                <i className="fa-solid fa-arrow-left mr-2"></i> Kembali ke Peta
                            </button>
                            {gameState.currentLevel === 1 && <Level1 />}
                            {gameState.currentLevel === 2 && <Level2 />}
                            {gameState.currentLevel === 3 && <Level3 />}
                            {gameState.currentLevel === 4 && <Level4 />}
                            {gameState.currentLevel === 5 && <Level5 />}
                            {gameState.currentLevel === 6 && <Level6 />}
                            {gameState.currentLevel === 7 && <Level7 />}
                            {gameState.currentLevel === 8 && <Level8 />}
                        </div>
                    );
                }

                return (
                    <div className="max-w-4xl mx-auto mt-6 md:mt-10">
                        <div className="text-center mb-10">
                            <h2 className="text-2xl md:text-4xl font-black text-white mb-2 tracking-wide drop-shadow-md">PETA MISI</h2>
                            <p className="text-blue-200">Selesaikan misi untuk membuka level selanjutnya!</p>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                            {levels.map((level) => {
                                const isUnlocked = level.id <= gameState.unlockedLevel;
                                const isCompleted = level.id < gameState.unlockedLevel;

                                return (
                                    <button 
                                        key={level.id} 
                                        onClick={() => isUnlocked && startGame(level.id)}
                                        className={`relative p-5 rounded-3xl flex flex-col items-center text-center transition-all duration-300
                                            ${isUnlocked 
                                                ? 'bg-white hover:bg-blue-50 cursor-pointer shadow-lg hover:-translate-y-2' 
                                                : 'bg-white/10 backdrop-blur-md cursor-not-allowed border border-white/20'}`}
                                    >
                                        <div className={`w-14 h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center mb-3 text-2xl
                                            ${isCompleted ? 'bg-green-100 text-green-600' : 
                                              isUnlocked ? 'bg-blue-100 text-blue-600 shadow-inner' : 'bg-slate-800 text-slate-500'}`}>
                                            <i className={isUnlocked ? level.icon : 'fa-solid fa-lock'}></i>
                                        </div>
                                        <h3 className={`font-bold text-sm md:text-base ${isUnlocked ? 'text-slate-800' : 'text-slate-400'}`}>
                                            {level.title}
                                        </h3>
                                        <p className={`text-xs mt-1 ${isUnlocked ? 'text-slate-500' : 'text-slate-500'}`}>
                                            {level.subtitle}
                                        </p>
                                        {isCompleted && (
                                            <div className="absolute -top-2 -right-2 w-8 h-8 bg-green-500 text-white rounded-full border-4 border-white flex items-center justify-center text-sm shadow-sm">
                                                <i className="fa-solid fa-check"></i>
                                            </div>
                                        )}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-cross-pattern pb-20 relative">
                    {/* Header Top Bar */}
                    <div className="bg-white/90 backdrop-blur-md shadow-sm p-4 sticky top-0 z-40 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white">
                                <i className="fa-solid fa-palette text-sm"></i>
                            </div>
                            <h1 className="font-bold text-slate-800 text-base hidden md:block tracking-tight">Seni Rupa Kelas 5</h1>
                        </div>
                        
                        {gameState.isPlaying && (
                            <div className="flex items-center gap-3 md:gap-6">
                                <div className="flex flex-col md:flex-row md:items-center gap-1 md:gap-2">
                                    <span className="text-slate-500 text-xs md:text-sm font-semibold">
                                        <i className="fa-solid fa-user mr-1 text-slate-400"></i> {gameState.studentName}
                                    </span>
                                </div>
                                <div className="bg-yellow-100 text-yellow-700 px-3 py-1.5 md:px-4 md:py-2 rounded-full font-black text-sm md:text-base border border-yellow-200 shadow-sm flex items-center gap-2">
                                    <i className="fa-solid fa-star text-yellow-500"></i>
                                    {gameState.score}
                                </div>
                            </div>
                        )}
                        
                        <button onClick={toggleFullScreen} className="text-slate-400 hover:text-slate-700 p-2 transition-colors">
                            <i className="fa-solid fa-expand text-lg"></i>
                        </button>
                    </div>

                    {/* Toast Notification */}
                    <div className={`fixed top-24 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full text-white font-bold shadow-xl transition-all duration-300 ${toast.show ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'} ${toast.type === 'success' ? 'bg-green-500' : 'bg-red-500'}`}>
                        <i className={`fa-solid ${toast.type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} mr-2`}></i>
                        {toast.message}
                    </div>

                    {/* Main Content Area */}
                    <div className="container mx-auto px-4">
                        {renderContent()}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
