<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsur dan Prinsip Seni Rupa - Kelas 5</title>
    <meta name="description" content="Game edukasi interaktif untuk siswa kelas 5 SD menjelajahi unsur dan prinsip seni rupa di sekitar kita.">
    <meta property="og:image" content="tumi.jpg">
    
    <!-- Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Untuk Ikon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Untuk menerjemahkan JSX di browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }
        .bg-pattern {
            background-color: #1e3a8a;
            background-image: radial-gradient(#3b82f6 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [gameState, setGameState] = useState({
                isPlaying: false,
                studentName: '',
                studentClass: '',
                unlockedLevel: 1,
                currentLevel: null,
                score: 0,
                lives: 3,
                badges: [],
                savedArtwork: null
            });

            const [showForm, setShowForm] = useState(false);
            const [nameInput, setNameInput] = useState('');
            const [classInput, setClassInput] = useState('5');
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [gameState.currentLevel, gameState.isPlaying]);

            const showFeedback = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => {
                    setToast({ show: false, message: '', type: 'success' });
                }, 3000);
            };

            const startGame = (levelId) => {
                setGameState({ ...gameState, currentLevel: levelId });
            };

            const handleStartPlaying = (e) => {
                e.preventDefault();
                if (nameInput.trim() === '') {
                    showFeedback('Masukkan nama kamu dulu ya!', 'error');
                    return;
                }
                setGameState({
                    ...gameState,
                    isPlaying: true,
                    studentName: nameInput,
                    studentClass: classInput,
                });
                setShowForm(false);
            };

            const completeLevel = (levelId, points = 10) => {
                const nextLevel = levelId + 1;
                setGameState((prev) => ({
                    ...prev,
                    score: prev.score + points,
                    unlockedLevel: nextLevel > prev.unlockedLevel ? nextLevel : prev.unlockedLevel,
                    currentLevel: null
                }));
                showFeedback(`Misi ${levelId} Selesai! +${points} Poin`, 'success');
            };

            const levels = [
                { id: 1, title: 'Misi 1', subtitle: 'Kenali Unsur', icon: 'fa-solid fa-book-open' },
                { id: 2, title: 'Misi 2', subtitle: 'Cari Unsur', icon: 'fa-solid fa-magnifying-glass' },
                { id: 3, title: 'Misi 3', subtitle: 'Cocokkan', icon: 'fa-solid fa-arrow-pointer' },
                { id: 4, title: 'Misi 4', subtitle: 'Tebak Gambar', icon: 'fa-regular fa-image' },
                { id: 5, title: 'Misi 5', subtitle: 'Susun Seni', icon: 'fa-solid fa-shapes' },
                { id: 6, title: 'Misi 6', subtitle: 'Kenali Prinsip', icon: 'fa-solid fa-star' },
                { id: 7, title: 'Misi 7', subtitle: 'Eksperimen', icon: 'fa-solid fa-palette' },
                { id: 8, title: 'Misi 8', subtitle: 'Studio Seni', icon: 'fa-solid fa-trophy' },
            ];

            const Level1 = () => (
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-3xl mx-auto w-full">
                    <h2 className="text-xl font-bold text-slate-800 mb-2">Misi 1 : Kenali Unsur Rupa</h2>
                    <p className="text-slate-600 mb-6">Pahami unsur-unsur dasar yang membentuk sebuah karya seni.</p>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                            <h3 className="font-bold text-blue-800">Titik & Garis</h3>
                            <p className="text-sm text-blue-600 mt-1">Titik adalah unsur terkecil. Garis adalah kumpulan titik yang memanjang.</p>
                        </div>
                        <div className="bg-green-50 p-4 rounded-xl border border-green-100">
                            <h3 className="font-bold text-green-800">Bidang & Bentuk</h3>
                            <p className="text-sm text-green-600 mt-1">Bidang memiliki panjang dan lebar (2D). Bentuk memiliki volume (3D).</p>
                        </div>
                        <div className="bg-orange-50 p-4 rounded-xl border border-orange-100">
                            <h3 className="font-bold text-orange-800">Warna & Tekstur</h3>
                            <p className="text-sm text-orange-600 mt-1">Warna memberi kesan nyata. Tekstur adalah sifat permukaan benda (halus/kasar).</p>
                        </div>
                        <div className="bg-purple-50 p-4 rounded-xl border border-purple-100">
                            <h3 className="font-bold text-purple-800">Ruang</h3>
                            <p className="text-sm text-purple-600 mt-1">Ruang memberi kesan jauh-dekat dan kedalaman pada gambar.</p>
                        </div>
                    </div>
                    <button onClick={() => completeLevel(1)} className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-colors">
                        Lanjutkan Misi
                    </button>
                </div>
            );

            const Level2 = () => {
                const [matches, setMatches] = useState(0);
                const [selectedLabel, setSelectedLabel] = useState(null);
                const [matchedItems, setMatchedItems] = useState([]);

                const items = [
                    { id: 'garis', label: 'Garis', object: 'Batang Pohon', emoji: '🌳' },
                    { id: 'warna', label: 'Warna', object: 'Daun', emoji: '🍃' },
                    { id: 'tekstur', label: 'Tekstur', object: 'Batu', emoji: '🪨' },
                    { id: 'bidang', label: 'Bidang', object: 'Jendela', emoji: '🪟' },
                    { id: 'bentuk', label: 'Bentuk', object: 'Bola', emoji: '⚽' },
                ];

                const handleObjectClick = (item) => {
                    if (!selectedLabel) return;
                    if (selectedLabel.id === item.id && !matchedItems.includes(item.id)) {
                        setMatches(m => m + 1);
                        setMatchedItems([...matchedItems, item.id]);
                        setSelectedLabel(null);
                        showFeedback('Tepat sekali!', 'success');
                    } else if (!matchedItems.includes(item.id)) {
                        showFeedback('Kurang tepat, coba lagi!', 'error');
                        setSelectedLabel(null);
                    }
                };

                const isCompleted = matches === items.length;

                return (
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-4xl mx-auto w-full">
                        <h2 className="text-xl font-bold text-slate-800 mb-2">Misi 2 : Cari Unsur Rupa</h2>
                        <p className="text-slate-600 mb-6">Pilih label di bawah, lalu pilih objek yang sesuai.</p>
                        
                        <div className="bg-green-50 p-6 rounded-xl mb-6 flex justify-around flex-wrap gap-4 border border-green-200">
                            {items.map(item => (
                                <button key={item.id} onClick={() => handleObjectClick(item)} disabled={matchedItems.includes(item.id)}
                                    className={`relative p-4 rounded-xl flex flex-col items-center justify-center transition-all min-w-[100px]
                                    ${matchedItems.includes(item.id) ? 'bg-green-200 opacity-50 cursor-not-allowed scale-95' : 'bg-white hover:bg-slate-50 shadow-sm border border-slate-200 hover:-translate-y-1'}`}
                                >
                                    <span className="text-4xl mb-2">{item.emoji}</span>
                                    <span className="font-bold text-sm text-slate-700">{item.object}</span>
                                    {matchedItems.includes(item.id) && <i className="fa-solid fa-check text-green-600 mt-2 absolute"></i>}
                                </button>
                            ))}
                        </div>

                        <div className="flex flex-wrap gap-3 justify-center mb-8">
                            {items.map(item => (
                                <button key={`label-${item.id}`} onClick={() => setSelectedLabel(item)} disabled={matchedItems.includes(item.id)}
                                    className={`px-6 py-2 rounded-lg font-bold transition-colors border
                                    ${matchedItems.includes(item.id) ? 'bg-slate-100 text-slate-400 border-slate-200 hidden' : 
                                    selectedLabel?.id === item.id ? 'bg-blue-600 text-white border-blue-600' : 'bg-blue-50 text-blue-600 border-blue-200 hover:bg-blue-100'}`}
                                >
                                    {item.label}
                                </button>
                            ))}
                        </div>

                        {isCompleted && (
                            <div className="text-center animate-bounce mb-6">
                                <span className="bg-green-100 text-green-700 font-bold px-4 py-2 rounded-full border border-green-300">
                                    Hebat! Semua Unsur Ditemukan!
                                </span>
                            </div>
                        )}
                        
                        <button onClick={() => completeLevel(2, 20)} disabled={!isCompleted}
                            className={`w-full font-bold py-3 rounded-xl transition-colors ${isCompleted ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                            {isCompleted ? 'Lanjutkan Misi' : 'Selesaikan Misi Dulu'}
                        </button>
                    </div>
                );
            };

            const Level3 = () => {
                const [selectedCards, setSelectedCards] = useState([]);
                const [matchedPairs, setMatchedPairs] = useState([]);
                const [shuffledCards, setShuffledCards] = useState([]);

                useEffect(() => {
                    const cards = [
                        { id: '1a', type: 'unsur', text: 'Bidang', pairId: '1' },
                        { id: '1b', type: 'benda', text: 'Buku', pairId: '1' },
                        { id: '2a', type: 'unsur', text: 'Bentuk', pairId: '2' },
                        { id: '2b', type: 'benda', text: 'Jeruk', pairId: '2' },
                        { id: '3a', type: 'unsur', text: 'Garis', pairId: '3' },
                        { id: '3b', type: 'benda', text: 'Pagar', pairId: '3' },
                        { id: '4a', type: 'unsur', text: 'Warna', pairId: '4' },
                        { id: '4b', type: 'benda', text: 'Pelangi', pairId: '4' },
                    ].sort(() => Math.random() - 0.5);
                    setShuffledCards(cards);
                }, []);

                const handleCardClick = (card) => {
                    if (selectedCards.length === 2 || matchedPairs.includes(card.pairId) || selectedCards.find(c => c.id === card.id)) return;
                    const newSelected = [...selectedCards, card];
                    setSelectedCards(newSelected);

                    if (newSelected.length === 2) {
                        if (newSelected[0].pairId === newSelected[1].pairId && newSelected[0].type !== newSelected[1].type) {
                            setTimeout(() => {
                                setMatchedPairs([...matchedPairs, newSelected[0].pairId]);
                                setSelectedCards([]);
                                showFeedback('Pasangan Cocok!', 'success');
                            }, 800);
                        } else {
                            setTimeout(() => {
                                setSelectedCards([]);
                                showFeedback('Belum cocok, coba lagi.', 'error');
                            }, 800);
                        }
                    }
                };

                const isCompleted = matchedPairs.length === 4;

                return (
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-3xl mx-auto w-full">
                        <h2 className="text-xl font-bold text-slate-800 mb-2">Misi 3 : Cari Pasangan</h2>
                        <p className="text-slate-600 mb-6">Cocokkan kartu <b>Unsur</b> dengan contoh <b>Benda</b> yang tepat.</p>
                        
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                            {shuffledCards.map(card => {
                                const isSelected = selectedCards.find(c => c.id === card.id);
                                const isMatched = matchedPairs.includes(card.pairId);
                                return (
                                    <button key={card.id} onClick={() => handleCardClick(card)}
                                        className={`h-24 p-2 rounded-xl flex flex-col items-center justify-center border-2 transition-all font-bold text-lg
                                        ${isMatched ? 'bg-green-100 border-green-300 text-green-700 opacity-50 cursor-default scale-95' : 
                                        isSelected ? 'bg-blue-50 border-blue-400 text-blue-700 scale-105' : 
                                        'bg-white border-slate-200 text-slate-700 hover:border-slate-300 shadow-sm'}`}
                                    >
                                        <span className="text-xs font-normal text-slate-400 mb-1 uppercase tracking-wider">{card.type}</span>
                                        {card.text}
                                    </button>
                                );
                            })}
                        </div>
                        
                        <button onClick={() => completeLevel(3, 15)} disabled={!isCompleted}
                            className={`w-full font-bold py-3 rounded-xl transition-colors ${isCompleted ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                            {isCompleted ? 'Lanjutkan Misi' : 'Selesaikan Misi Dulu'}
                        </button>
                    </div>
                );
            };

            const Level4 = () => {
                const [currentQ, setCurrentQ] = useState(0);
                const questions = [
                    { image: '🪨', question: 'Unsur seni rupa apa yang paling dominan pada batu kasar ini?', options: ['Tekstur', 'Warna', 'Titik', 'Ruang'], answer: 'Tekstur' },
                    { image: '🪟', question: 'Permukaan datar pada jendela ini merupakan contoh dari...', options: ['Warna', 'Bidang', 'Tekstur', 'Titik'], answer: 'Bidang' },
                    { image: '⚽', question: 'Bola yang bulat dan memiliki ruang di dalamnya adalah contoh...', options: ['Bentuk', 'Garis', 'Titik', 'Bidang'], answer: 'Bentuk' }
                ];

                const handleAnswer = (opt) => {
                    if (opt === questions[currentQ].answer) {
                        showFeedback('Benar!', 'success');
                        if (currentQ < questions.length - 1) {
                            setTimeout(() => setCurrentQ(c => c + 1), 1000);
                        } else {
                            setTimeout(() => completeLevel(4, 20), 1000);
                        }
                    } else {
                        showFeedback('Salah, coba ingat lagi!', 'error');
                    }
                };

                return (
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-2xl mx-auto w-full text-center">
                        <h2 className="text-lg font-bold text-slate-800 mb-2">Misi 4 : Tebak Gambar</h2>
                        <p className="text-slate-600 mb-8">Pilih unsur yang paling menonjol.</p>
                        
                        <div className="text-9xl mb-8">{questions[currentQ].image}</div>
                        <p className="font-bold text-slate-700 mb-6">{questions[currentQ].question}</p>
                        
                        <div className="grid grid-cols-2 gap-4">
                            {questions[currentQ].options.map(opt => (
                                <button key={opt} onClick={() => handleAnswer(opt)}
                                    className="bg-blue-50 text-blue-700 border border-blue-200 py-3 rounded-xl font-bold hover:bg-blue-600 hover:text-white transition-colors">
                                    {opt}
                                </button>
                            ))}
                        </div>
                    </div>
                );
            };

            const Level5 = () => {
                const [isBuilt, setIsBuilt] = useState(false);
                
                return (
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-2xl mx-auto w-full text-center">
                        <h2 className="text-xl font-bold text-slate-800 mb-2">Misi 5 : Susun Seni</h2>
                        <p className="text-slate-600 mb-6">Satukan bentuk-bentuk geometris ini menjadi sebuah rumah!</p>
                        
                        <div className="h-64 bg-blue-50 border-2 border-dashed border-blue-200 rounded-xl relative overflow-hidden mb-6 flex items-center justify-center">
                            {!isBuilt ? (
                                <div className="flex gap-4 items-end">
                                   <div className="w-0 h-0 border-l-[40px] border-l-transparent border-b-[60px] border-b-red-400 border-r-[40px] border-r-transparent animate-pulse cursor-pointer" onClick={() => setIsBuilt(true)}></div>
                                   <div className="w-20 h-20 bg-yellow-400 animate-pulse cursor-pointer" onClick={() => setIsBuilt(true)}></div>
                                </div>
                            ) : (
                                <div className="absolute bottom-10 left-1/2 -translate-x-1/2">
                                    <div className="w-0 h-0 border-l-[60px] border-l-transparent border-b-[80px] border-b-red-500 border-r-[60px] border-r-transparent"></div>
                                    <div className="w-[120px] h-[100px] bg-yellow-400 relative border-t-0">
                                        <div className="w-8 h-12 bg-amber-700 absolute bottom-0 left-1/2 -translate-x-1/2 rounded-t-md"></div>
                                        <div className="w-8 h-8 bg-blue-300 absolute top-4 left-2 rounded-sm opacity-80 border-2 border-blue-200"></div>
                                        <div className="w-8 h-8 bg-blue-300 absolute top-4 right-2 rounded-sm opacity-80 border-2 border-blue-200"></div>
                                    </div>
                                </div>
                            )}
                        </div>

                        <button onClick={() => completeLevel(5, 10)} disabled={!isBuilt}
                            className={`w-full font-bold py-3 rounded-xl transition-colors ${isBuilt ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                            {isBuilt ? 'Lanjutkan Misi' : 'Bangun Rumah Dulu'}
                        </button>
                    </div>
                );
            };

            const Level6 = () => {
                const [selected, setSelected] = useState(null);
                const handleSelect = (ans) => {
                    setSelected(ans);
                    if (ans === 'b') {
                        showFeedback('Benar! Komposisi B lebih seimbang.', 'success');
                    } else {
                        showFeedback('Kurang tepat, coba lihat berat visualnya.', 'error');
                    }
                };

                return (
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-3xl mx-auto w-full text-center">
                        <h2 className="text-xl font-bold text-slate-800 mb-2">Misi 6 : Prinsip Keseimbangan</h2>
                        <p className="text-slate-600 mb-6">Pilih gambar mana yang memiliki Keseimbangan Asimetris yang baik.</p>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <div onClick={() => handleSelect('a')} className={`p-4 border-2 rounded-xl cursor-pointer bg-slate-50 ${selected === 'a' ? 'border-red-400' : 'border-slate-200'}`}>
                                <h3 className="font-bold mb-4">Gambar A</h3>
                                <div className="h-32 flex items-center justify-start gap-2 pl-4">
                                   <div className="w-16 h-16 bg-slate-800 rounded-full"></div>
                                   <div className="w-4 h-4 bg-slate-400 rounded-full"></div>
                                </div>
                            </div>
                            <div onClick={() => handleSelect('b')} className={`p-4 border-2 rounded-xl cursor-pointer bg-slate-50 ${selected === 'b' ? 'border-green-400' : 'border-slate-200'}`}>
                                <h3 className="font-bold mb-4">Gambar B</h3>
                                <div className="h-32 flex items-center justify-between px-8">
                                   <div className="w-16 h-16 bg-slate-800 rounded-full"></div>
                                   <div className="w-8 h-8 bg-slate-400 rounded-full ml-auto"></div>
                                   <div className="w-8 h-8 bg-slate-400 rounded-full ml-2"></div>
                                </div>
                            </div>
                        </div>

                        <button onClick={() => completeLevel(6, 15)} disabled={selected !== 'b'}
                            className={`w-full font-bold py-3 rounded-xl transition-colors ${selected === 'b' ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                            Lanjutkan Misi
                        </button>
                    </div>
                );
            };

            const Level7 = () => {
                const [mixedColor, setMixedColor] = useState(null);
                const [slots, setSlots] = useState([]);
                
                const colors = [
                    { id: 'red', hex: '#ef4444', name: 'Merah' },
                    { id: 'yellow', hex: '#facc15', name: 'Kuning' },
                    { id: 'blue', hex: '#3b82f6', name: 'Biru' }
                ];

                const handleMix = (color) => {
                    if (slots.length < 2) {
                        const newSlots = [...slots, color];
                        setSlots(newSlots);
                        
                        if (newSlots.length === 2) {
                            let result = '';
                            const ids = newSlots.map(c => c.id).sort().join('-');
                            if (ids === 'red-yellow') result = '#ea580c'; // Oranye
                            else if (ids === 'blue-yellow') result = '#22c55e'; // Hijau
                            else if (ids === 'blue-red') result = '#9333ea'; // Ungu
                            else result = '#475569'; // Abu-abu
                            
                            setMixedColor(result);
                            setTimeout(() => {
                                showFeedback('Wah, warna baru tercipta!', 'success');
                            }, 1500);
                        }
                    }
                };

                const reset = () => {
                    setSlots([]);
                    setMixedColor(null);
                };

                return (
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-2xl mx-auto w-full text-center">
                        <h2 className="text-xl font-bold text-slate-800 mb-2">Misi 7 : Eksperimen Warna</h2>
                        <p className="text-slate-600 mb-6">Pilih dua warna primer untuk dicampur!</p>
                        
                        <div className="flex justify-center gap-4 mb-8">
                            {colors.map(c => (
                                <button key={c.id} onClick={() => handleMix(c)} className="w-16 h-16 rounded-full shadow-md border-4 border-white hover:scale-110 transition-transform" style={{backgroundColor: c.hex}}></button>
                            ))}
                        </div>

                        <div className="flex items-center justify-center gap-4 mb-8 bg-slate-50 p-6 rounded-xl border border-slate-200">
                            <div className="w-20 h-20 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center shadow-inner" style={{backgroundColor: slots[0]?.hex || 'transparent'}}>
                                {!slots[0] && <span className="text-slate-300 font-bold">1</span>}
                            </div>
                            <span className="text-2xl font-bold text-slate-400">+</span>
                            <div className="w-20 h-20 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center shadow-inner" style={{backgroundColor: slots[1]?.hex || 'transparent'}}>
                                {!slots[1] && <span className="text-slate-300 font-bold">2</span>}
                            </div>
                            <span className="text-2xl font-bold text-slate-400">=</span>
                            <div className="w-24 h-24 rounded-2xl border-4 border-white shadow-lg transition-colors duration-1000 ease-in-out" style={{backgroundColor: mixedColor || '#f8fafc'}}></div>
                        </div>
                        
                        <div className="flex gap-4">
                            <button onClick={reset} className="flex-1 bg-slate-200 text-slate-700 font-bold py-3 rounded-xl hover:bg-slate-300">Ulangi</button>
                            <button onClick={() => completeLevel(7, 20)} disabled={!mixedColor}
                                className={`flex-1 font-bold py-3 rounded-xl transition-colors ${mixedColor ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-slate-100 text-slate-300 cursor-not-allowed'}`}>
                                Lanjutkan Misi
                            </button>
                        </div>
                    </div>
                );
            };

            const Level8 = () => {
                const canvasRef = useRef(null);
                const [ctx, setCtx] = useState(null);
                const [color, setColor] = useState('#000000');
                const [tool, setTool] = useState('brush'); 
                
                useEffect(() => {
                    if (canvasRef.current) {
                        const context = canvasRef.current.getContext('2d');
                        context.fillStyle = '#ffffff';
                        context.fillRect(0, 0, canvasRef.current.width, canvasRef.current.height);
                        setCtx(context);
                    }
                }, []);

                const placeStamp = (e) => {
                    if (!ctx || tool === 'brush') return;
                    const rect = canvasRef.current.getBoundingClientRect();
                    
                    // Normalisasi ukuran klik berdasarkan skala tampilan canvas
                    const scaleX = canvasRef.current.width / rect.width;
                    const scaleY = canvasRef.current.height / rect.height;
                    
                    const x = (e.clientX - rect.left) * scaleX;
                    const y = (e.clientY - rect.top) * scaleY;
                    
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    
                    const size = 30;

                    if (tool === 'circle') {
                        ctx.arc(x, y, size, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (tool === 'square') {
                        ctx.fillRect(x - size, y - size, size * 2, size * 2);
                    } else if (tool === 'triangle') {
                        ctx.moveTo(x, y - size);
                        ctx.lineTo(x + size, y + size);
                        ctx.lineTo(x - size, y + size);
                        ctx.closePath();
                        ctx.fill();
                    } else if (tool === 'tree') {
                        ctx.fillStyle = '#8B4513';
                        ctx.fillRect(x - 10, y, 20, 40);
                        ctx.fillStyle = color; 
                        ctx.arc(x, y - 10, 25, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (tool === 'house') {
                        ctx.fillStyle = color;
                        ctx.fillRect(x - 20, y - 10, 40, 30);
                        ctx.fillStyle = '#ef4444'; 
                        ctx.moveTo(x - 25, y - 10);
                        ctx.lineTo(x, y - 35);
                        ctx.lineTo(x + 25, y - 10);
                        ctx.closePath();
                        ctx.fill();
                    }
                };

                const handleClear = () => {
                    if (ctx) {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvasRef.current.width, canvasRef.current.height);
                    }
                };

                const handleFinish = () => {
                    const dataUrl = canvasRef.current.toDataURL("image/jpeg", 1.0);
                    setGameState({ ...gameState, currentLevel: 9, savedArtwork: dataUrl });
                    showFeedback('Karya berhasil disimpan!', 'success');
                };

                return (
                    <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 max-w-5xl mx-auto w-full">
                        <div className="flex flex-col md:flex-row gap-6">
                            <div className="flex-1">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-slate-800">Misi 8 : Studio Seni</h2>
                                    <button onClick={handleClear} className="text-sm bg-red-50 text-red-600 px-3 py-1 rounded-lg hover:bg-red-100 flex items-center">
                                        <i className="fa-solid fa-eraser mr-2"></i> Hapus Semua
                                    </button>
                                </div>
                                
                                <div className="border-4 border-slate-200 rounded-xl overflow-hidden bg-slate-50 cursor-crosshair">
                                    <canvas ref={canvasRef} width={800} height={450} onClick={placeStamp} className="w-full h-auto block touch-none" style={{ aspectRatio: '16/9' }} />
                                </div>
                                <p className="text-xs text-slate-500 mt-2 text-center">Pilih alat stempel di samping lalu klik pada kanvas.</p>
                            </div>

                            <div className="w-full md:w-64 flex flex-col gap-6">
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <h3 className="text-sm font-bold text-slate-700 mb-3">Warna</h3>
                                    <div className="flex flex-wrap gap-2">
                                        {['#ef4444', '#facc15', '#3b82f6', '#22c55e', '#f97316', '#9333ea', '#8b4513', '#000000', '#ffffff'].map(c => (
                                            <button key={c} onClick={() => setColor(c)} className={`w-8 h-8 rounded-full border-2 ${color === c ? 'border-slate-800 scale-110' : 'border-slate-200'}`} style={{backgroundColor: c}}></button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <h3 className="text-sm font-bold text-slate-700 mb-3">Objek / Bentuk</h3>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => setTool('circle')} className={`p-2 rounded-lg flex flex-col items-center border ${tool === 'circle' ? 'bg-blue-100 border-blue-400' : 'bg-white border-slate-200'}`}>
                                            <span className="text-lg mb-1">⭕</span> <span className="text-[10px]">Lingkaran</span>
                                        </button>
                                        <button onClick={() => setTool('square')} className={`p-2 rounded-lg flex flex-col items-center border ${tool === 'square' ? 'bg-blue-100 border-blue-400' : 'bg-white border-slate-200'}`}>
                                            <span className="text-lg mb-1">⬛</span> <span className="text-[10px]">Persegi</span>
                                        </button>
                                        <button onClick={() => setTool('triangle')} className={`p-2 rounded-lg flex flex-col items-center border ${tool === 'triangle' ? 'bg-blue-100 border-blue-400' : 'bg-white border-slate-200'}`}>
                                            <span className="text-lg mb-1">🔺</span> <span className="text-[10px]">Segitiga</span>
                                        </button>
                                        <button onClick={() => setTool('tree')} className={`p-2 rounded-lg flex flex-col items-center border ${tool === 'tree' ? 'bg-blue-100 border-blue-400' : 'bg-white border-slate-200'}`}>
                                            <span className="text-lg mb-1">🌳</span> <span className="text-[10px]">Pohon</span>
                                        </button>
                                        <button onClick={() => setTool('house')} className={`p-2 rounded-lg flex flex-col items-center border ${tool === 'house' ? 'bg-blue-100 border-blue-400' : 'bg-white border-slate-200'}`}>
                                            <span className="text-lg mb-1">🏠</span> <span className="text-[10px]">Rumah</span>
                                        </button>
                                    </div>
                                </div>

                                <button onClick={handleFinish} className="mt-auto w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 shadow-md">
                                    Selesai & Kumpulkan
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            const Results = () => (
                <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 max-w-3xl mx-auto w-full text-center">
                    <h2 className="text-3xl font-black text-blue-900 mb-2">MISI SELESAI! 🎉</h2>
                    <p className="text-slate-600 mb-8">Hebat {gameState.studentName}! Kamu sudah mengenali unsur dan prinsip seni rupa.</p>
                    
                    {gameState.savedArtwork && (
                        <div className="mb-8 border-4 border-slate-200 rounded-xl overflow-hidden shadow-md max-w-xl mx-auto">
                            <img src={gameState.savedArtwork} alt="Karya Siswa" className="w-full h-auto block" />
                        </div>
                    )}

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <div className="bg-blue-50 p-4 rounded-xl">
                            <p className="text-sm text-blue-600 font-bold">Skor Total</p>
                            <p className="text-3xl font-black text-blue-800">{gameState.score}</p>
                        </div>
                        <div className="bg-green-50 p-4 rounded-xl">
                            <p className="text-sm text-green-600 font-bold">Unsur</p>
                            <p className="text-xl font-bold text-green-800 mt-1">✅ Tercapai</p>
                        </div>
                        <div className="bg-purple-50 p-4 rounded-xl">
                            <p className="text-sm text-purple-600 font-bold">Prinsip</p>
                            <p className="text-xl font-bold text-purple-800 mt-1">✅ Tercapai</p>
                        </div>
                        <div className="bg-orange-50 p-4 rounded-xl">
                            <p className="text-sm text-orange-600 font-bold">Penerapan</p>
                            <p className="text-xl font-bold text-orange-800 mt-1">✅ Tercapai</p>
                        </div>
                    </div>
                    
                    <div className="flex gap-4 justify-center">
                        <a href={gameState.savedArtwork} download={`Karya_Seni_${gameState.studentName.replace(/\s+/g, '_')}_Kelas5.jpg`}
                            className="bg-blue-600 text-white font-bold py-3 px-6 rounded-xl hover:bg-blue-700 flex items-center justify-center transition-colors">
                            <i className="fa-solid fa-download mr-2"></i> Download Karya (JPG)
                        </a>
                        <button onClick={() => window.location.reload()} className="bg-slate-200 text-slate-700 font-bold py-3 px-6 rounded-xl hover:bg-slate-300 flex items-center justify-center transition-colors">
                            <i className="fa-solid fa-rotate-left mr-2"></i> Main Lagi
                        </button>
                    </div>
                </div>
            );

            const renderCurrentView = () => {
                switch (gameState.currentLevel) {
                    case 1: return <Level1 />;
                    case 2: return <Level2 />;
                    case 3: return <Level3 />;
                    case 4: return <Level4 />;
                    case 5: return <Level5 />;
                    case 6: return <Level6 />;
                    case 7: return <Level7 />;
                    case 8: return <Level8 />;
                    case 9: return <Results />;
                    default: return null;
                }
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    {toast.show && (
                        <div className={`fixed top-4 right-4 z-50 px-6 py-4 rounded-xl shadow-lg font-bold flex items-center justify-between min-w-[250px] animate-bounce
                            ${toast.type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`}>
                            <span>{toast.message}</span>
                            <button onClick={() => setToast({ show: false, message: '', type: 'success' })} className="ml-4 opacity-80 hover:opacity-100">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    )}

                    {!gameState.isPlaying ? (
                        <div className="flex-1 bg-pattern flex items-center justify-center p-4 relative min-h-screen">
                            <div className="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl z-10 relative">
                                <div className="flex justify-center mb-6">
                                    <div className="w-24 h-24 rounded-full border-4 border-yellow-400 overflow-hidden shadow-lg bg-blue-100 flex items-center justify-center">
                                        <span className="text-5xl">👨‍🏫</span>
                                    </div>
                                </div>
                                
                                <h1 className="text-2xl font-black text-center text-blue-900 mb-2 uppercase tracking-wide">
                                    Unsur dan Prinsip Seni Rupa
                                </h1>
                                <p className="text-center font-bold text-orange-500 mb-6">KELAS 5</p>
                                
                                {!showForm ? (
                                    <button onClick={() => setShowForm(true)}
                                        className="w-full bg-orange-500 text-white font-bold text-lg py-4 rounded-xl shadow-lg hover:bg-orange-600 transition-all hover:scale-105 flex items-center justify-center">
                                        MULAI BERMAIN <span className="ml-2">→</span>
                                    </button>
                                ) : (
                                    <form onSubmit={handleStartPlaying} className="animate-fade-in">
                                        <h3 className="text-center font-bold text-slate-700 mb-4">Isi Data Diri Dulu Yuk!</h3>
                                        <div className="mb-4">
                                            <label className="block text-sm font-bold text-slate-700 mb-1">Nama Lengkap</label>
                                            <input type="text" value={nameInput} onChange={(e) => setNameInput(e.target.value)}
                                                className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                                placeholder="Masukkan namamu..." required />
                                        </div>
                                        <div className="mb-6">
                                            <label className="block text-sm font-bold text-slate-700 mb-1">Kelas</label>
                                            <input type="text" value={classInput} onChange={(e) => setClassInput(e.target.value)}
                                                className="w-full p-3 border border-slate-300 rounded-lg outline-none bg-slate-50 text-slate-600" readOnly />
                                        </div>
                                        <button type="submit" className="w-full bg-blue-800 text-white font-bold py-3 rounded-xl hover:bg-blue-900 transition-colors flex items-center justify-center">
                                            LANJUT KE PERMAINAN <span className="ml-2">▶</span>
                                        </button>
                                    </form>
                                )}
                            </div>
                            <div className="absolute inset-0 bg-blue-900/40 z-0"></div>
                        </div>
                    ) : (
                        <div className="flex-1 flex flex-col">
                            <header className="bg-white shadow-sm py-4 px-6 flex justify-between items-center sticky top-0 z-40">
                                <div>
                                    <h1 className="font-black text-xl text-blue-900 uppercase tracking-tight">Peta Misi</h1>
                                    <p className="text-sm text-slate-500 font-medium">Halo, {gameState.studentName}! Pilih misimu.</p>
                                </div>
                                <div className="flex gap-3">
                                    <div className="bg-red-50 text-red-500 px-3 py-1 rounded-lg font-bold flex items-center text-sm border border-red-100 shadow-sm">
                                        ❤️ {gameState.lives}
                                    </div>
                                    <div className="bg-yellow-50 text-yellow-600 px-3 py-1 rounded-lg font-bold flex items-center text-sm border border-yellow-100 shadow-sm">
                                        ⭐ {gameState.score}
                                    </div>
                                </div>
                            </header>

                            <main className="flex-1 p-4 md:p-8 flex justify-center items-start">
                                {!gameState.currentLevel ? (
                                    <div className="max-w-4xl w-full">
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                            {levels.map((level) => {
                                                const isLocked = level.id > gameState.unlockedLevel;
                                                const isActive = level.id === gameState.unlockedLevel;

                                                return (
                                                    <button key={level.id} onClick={() => !isLocked && startGame(level.id)} disabled={isLocked}
                                                        className={`relative p-4 rounded-2xl flex flex-col items-center justify-center border-2 transition-all duration-300 min-h-[140px]
                                                            ${isActive ? 'border-green-400 bg-green-50 shadow-md transform md:scale-105' : 
                                                            isLocked ? 'border-slate-200 bg-white/80 opacity-80' : 
                                                            'border-white bg-white hover:border-blue-200 hover:bg-blue-50 hover:shadow-md'}`}>
                                                        
                                                        {isLocked && (
                                                            <div className="absolute top-3 right-3 text-slate-400 opacity-60">
                                                                <i className="fa-solid fa-lock text-sm"></i>
                                                            </div>
                                                        )}
                                                        
                                                        <div className={`w-14 h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center mb-3 transition-colors
                                                            ${isActive ? 'bg-green-100 text-green-600' : 'bg-blue-100 text-blue-500'}`}>
                                                            <i className={`${level.icon} text-2xl ${isLocked ? 'opacity-50 saturate-50' : ''}`}></i>
                                                        </div>
                                                        <span className={`text-sm md:text-base font-bold ${isActive ? 'text-green-700' : 'text-slate-700'}`}>
                                                            {level.title}
                                                        </span>
                                                        <span className={`text-xs mt-1 ${isActive ? 'text-green-600' : 'text-slate-500'}`}>
                                                            {level.subtitle}
                                                        </span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="w-full flex flex-col items-center animate-fade-in pt-4">
                                        {renderCurrentView()}
                                    </div>
                                )}
                            </main>
                        </div>
                    )}
                    <footer className="bg-slate-900 text-slate-400 text-center py-4 text-sm font-medium mt-auto">
                        © 2026 - Created By Pak LEhan
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
